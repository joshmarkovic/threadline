[alias]
xtask = "run --quiet --locked -p xtask --"

[registries.threadline-gpui]
index = "https://cargo.threadline.invalid/gpui-component/visible-source-line-v1"

[source.threadline-gpui]
registry = "https://cargo.threadline.invalid/gpui-component/visible-source-line-v1"
