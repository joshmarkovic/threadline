[package]
name = "threadline-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
threadline-platform = { path = "../threadline-platform" }
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D","Win32_Graphics_Direct3D11","Win32_Graphics_Dxgi"] }
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem", "Win32_Security",
    "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation",
    "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Wdk_System_SystemServices"
] }

[target.'cfg(windows)'.dev-dependencies]
threadline-storage = { path = "../threadline-storage" }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Pipes", "Win32_Security"] }
