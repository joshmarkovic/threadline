[package]
name = "threadline-app"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "threadline"
path = "src/main.rs"

[features]
e2e = ["dep:rusqlite", "dep:sha2", "gpui-kit/profiler"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
gpui-kit = "=0.10.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
markdown = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
rusqlite = { version = "0.40.2", optional = true }
sha2 = { version = "0.10", optional = true }
threadline-core = { path = "../threadline-core" }
threadline-platform = { path = "../threadline-platform" }
threadline-storage = { path = "../threadline-storage" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
zeroize = "1"

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
rusqlite = "0.40.2"
tempfile = "3"
