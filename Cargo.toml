[workspace]
members = [
    "crates/threadline-app",
    "crates/threadline-core",
    "crates/threadline-installer",
    "crates/threadline-platform",
    "crates/threadline-storage",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[profile.release]
debug = 0
